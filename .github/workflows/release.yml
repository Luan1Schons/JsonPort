name: Release to PyPI and GitHub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine pytest pytest-cov pytest-benchmark black flake8 mypy
        pip install -e .
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Check code quality
      run: |
        python -m black --check jsonport/ tests/
        python -m flake8 jsonport/ tests/
        python -m mypy jsonport/
    
    - name: Build package
      run: |
        python -m build
    
    - name: Publish to PyPI
      if: matrix.python-version == '3.11'  # Publica apenas uma vez
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -n "$TWINE_PASSWORD" ]; then
          python -m twine upload dist/*
        else
          echo "::warning::PYPI_API_TOKEN secret not configured in GitHub Secrets, skipping PyPI upload."
        fi
    
    - name: Extract changelog
      if: matrix.python-version == '3.11'  # Extrai apenas uma vez
      run: |
        python -c "
        import re
        
        raw_version = '${{ github.ref_name }}'
        version = raw_version.lstrip('v')
        
        with open('CHANGELOG.md', 'r') as f:
            content = f.read()
        
        pattern = r'## \[v?(' + re.escape(version) + r')\].*?\n(.*?)(?=\n## \[|\n\[Unreleased\]:|\Z)'
        match = re.search(pattern, content, re.DOTALL)
        
        if match:
            changelog_content = match.group(2).strip()
            changelog_content = '\n'.join(line for line in changelog_content.split('\n') if line.strip())
            print(changelog_content)
        else:
            print('Release ' + raw_version)
        " > changelog_content.txt
    
    - name: Create GitHub Release
      if: matrix.python-version == '3.11'  # Cria release apenas uma vez
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body_path: changelog_content.txt
        files: dist/*
        draft: false
        prerelease: false 